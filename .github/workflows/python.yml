# pyarrow release build: the sdist and the wheel matrix of
# dev/tasks/python-wheels/github.{linux,osx.amd64,osx.arm64,windows}.yml
# (matrix from dev/tasks/tasks.yml), each wheel tested after it is built.
#
# The prebuilt apache/arrow-dev vcpkg images are no longer published, so the
# vcpkg dependencies are built once per platform by the *-deps jobs and kept
# in a vcpkg "files" binary cache persisted with actions/cache. A deps job
# that runs out of time still saves the ports it finished, so the next run
# resumes where it stopped; the wheel jobs only start once a complete cache
# exists for their platform.

name: Python

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_VOLUME_PREFIX: ".docker/"
  PIP_INDEX_URL: "https://:2023-12-18@time-machines-pypi.sealsecurity.io/"
  # downloads through the time machine intermittently stall past pip's 15s
  # read timeout on the macOS runners
  PIP_DEFAULT_TIMEOUT: "120"
  PIP_RETRIES: "10"
  PYARROW_VERSION: "14.0.2"
  # ORC 1.9.0 is no longer on the apache.org mirrors ThirdpartyToolchain tries
  ARROW_ORC_URL: "https://archive.apache.org/dist/orc/orc-1.9.0/orc-1.9.0.tar.gz"
  # These tests need AWS resources that no longer exist (the public
  # voltrondata-labs-datasets bucket was deleted), so they cannot pass anywhere.
  S3_NETWORK_TESTS_DESELECT: "not test_s3fs_wrong_region and not test_resolve_s3_region and not (test_s3_real_aws and not region_selection)"
  # Printed after every wheel test run; pytest -r s prints each skip's reason.
  SKIPS_BY_DESIGN: |
    Skips that remain after installing every optional test dependency the platform allows (each one needs an external service, hardware, a different build, or an opt-in group; none is a pip/apt-installable package):
     - HDFS tests, test_fs.py hdfs cases and test_hdfs.py ('Cannot locate libhdfs' / 'No libhdfs available on system'): they need a running HDFS NameNode and libhdfs + a JVM. They are NOT skipped in this build: the 'Python HDFS and JVM tests' job of this workflow runs every one of them against a single-node HDFS 3.2.1 (like upstream's separate conda-python-hdfs job); this wheel-test container has no HDFS.
     - test_jvm.py (jpype): needs a JVM and the Arrow Java tools jar. It is NOT skipped in this build: the 'Python HDFS and JVM tests' job runs it with JPype and the arrow-tools 14.0.2 jar-with-dependencies built from this tree's java/.
     - test_gdb 'Arrow C++ debug symbols not available': the gdb pretty-printer tests need a debug build of libarrow; the wheels under test are the release-mode artifacts we ship (gdb itself is installed wherever the platform has one, so test_gdb_session runs).
     - cuda / test_cuda_numba_interop: need an NVIDIA GPU and a CUDA build of Arrow. gandiva: not built into the wheels (upstream ARROW_GANDIVA=OFF).
     - '<group> NOT enabled' (large_memory, slow, hypothesis, memory_leak, fastparquet, gandiva, nopandas, cython): opt-in pytest groups upstream's wheel test scripts leave off.
     - zoneinfo on Python 3.8: the module is stdlib only from Python 3.9.
     - Python 3.8 on x86_64 Linux, x86_64 macOS and Windows: interchange/test_conversion.py ('__dataframe__ added to pandas in 1.5.0', 'Column.size() bug in pandas', 'Bitmasks not supported'), test_pandas.py 'ArrowDtype missing' / 'pandas < 2.0 only supports nanosecond datetime64'. Upstream's python/requirements-wheel-test.txt deliberately tests these legs against the oldest supported numpy (numpy==1.19.5 for python_version < 3.9 on non-ARM), and every pandas >= 1.5 requires numpy >= 1.20.3, so pip resolves pandas 1.4.4 there. These tests do run, with pandas 2.0.3, on the Python 3.8 aarch64/arm64 legs (numpy 1.21.3) and on every Python 3.9-3.12 leg. The other pandas-version skips ('Regression in pandas 2.0.0', 'pandas >= 2.0 supports non-nanosecond datetime64') are the mirror-image version guards in upstream's tests.
     - Windows 's3 NOT enabled' / 'orc NOT enabled': upstream's ci/scripts/python_wheel_windows_test.bat sets PYARROW_TEST_S3=OFF and PYARROW_TEST_ORC=OFF; the S3 and ORC tests run on every Linux and macOS leg.

jobs:

  sdist:
    name: Python sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Arrow
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Archery
        run: |
          pip install -e dev/archery[docker]
          mkdir -p ~/.local/bin
          printf '#!/bin/sh\nexec docker compose "$@"\n' > ~/.local/bin/docker-compose
          chmod +x ~/.local/bin/docker-compose
          echo ~/.local/bin >> $GITHUB_PATH
      - name: Build sdist
        run: archery docker run -e PYARROW_VERSION=${PYARROW_VERSION} -e PIP_INDEX_URL=${PIP_INDEX_URL} python-sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/pyarrow-*.tar.gz
          if-no-files-found: error

  # The wheels are built with ARROW_BUILD_TESTS=OFF, so the C++ parquet
  # encryption unit tests (key management, KMS, key wrapping, encryption
  # configurations) are built and run here from the same source tree.
  cpp-parquet-encryption:
    name: C++ parquet encryption tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ARROW_TEST_DATA: ${{ github.workspace }}/testing/data
      PARQUET_TEST_DATA: ${{ github.workspace }}/cpp/submodules/parquet-testing/data
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout Arrow
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-cpp-parquet-encryption-${{ github.run_id }}
          restore-keys: ccache-cpp-parquet-encryption-
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache ninja-build libssl-dev libthrift-dev libboost-dev \
            libboost-filesystem-dev libboost-system-dev \
            rapidjson-dev libgtest-dev libgmock-dev libsnappy-dev \
            libzstd-dev liblz4-dev libbrotli-dev zlib1g-dev libre2-dev \
            libutf8proc-dev
      - name: Build
        timeout-minutes: 35
        run: |
          cmake -S cpp -B cpp-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DARROW_DEPENDENCY_SOURCE=AUTO \
            -DARROW_JEMALLOC=OFF \
            -DARROW_MIMALLOC=OFF \
            -DARROW_PARQUET=ON \
            -DPARQUET_REQUIRE_ENCRYPTION=ON \
            -DARROW_BUILD_TESTS=ON \
            -DARROW_WITH_SNAPPY=ON \
            -DARROW_WITH_ZLIB=ON
          cmake --build cpp-build --target parquet-encryption-test parquet-encryption-key-management-test
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-cpp-parquet-encryption-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Test
        run: ctest --test-dir cpp-build -R '^parquet-encryption' -V

  linux-deps:
    name: vcpkg deps manylinux ${{ matrix.manylinux }} ${{ matrix.arch_alias }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - manylinux: "2014"
            base: manylinux2014
            arch: amd64
            arch_alias: x86_64
            arch_short: amd64
            runs-on: ubuntu-24.04
          - manylinux: "2014"
            base: manylinux2014
            arch: arm64v8
            arch_alias: aarch64
            arch_short: arm64
            runs-on: ubuntu-24.04-arm
          - manylinux: "2_28"
            base: manylinux_2_28
            arch: amd64
            arch_alias: x86_64
            arch_short: amd64
            runs-on: ubuntu-24.04
          - manylinux: "2_28"
            base: manylinux_2_28
            arch: arm64v8
            arch_alias: aarch64
            arch_short: arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Arrow
        uses: actions/checkout@v4
      - name: Look up complete vcpkg cache
        id: done
        uses: actions/cache/restore@v4
        with:
          path: ci/vcpkg-bincache
          key: vcpkg-manylinux-${{ matrix.manylinux }}-${{ matrix.arch_short }}-done-${{ hashFiles('ci/vcpkg/**', '.env') }}
          lookup-only: true
      - name: Restore partial vcpkg cache
        if: steps.done.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ci/vcpkg-bincache
          key: vcpkg-manylinux-${{ matrix.manylinux }}-${{ matrix.arch_short }}-partial-${{ github.run_id }}
          restore-keys: vcpkg-manylinux-${{ matrix.manylinux }}-${{ matrix.arch_short }}-
      - name: Build vcpkg base image
        if: steps.done.outputs.cache-hit != 'true'
        run: |
          VCPKG=$(grep '^VCPKG=' .env | cut -d '=' -f2 | cut -d '#' -f1 | tr -d '" ')
          docker build \
            --target vcpkg-base \
            --build-arg base=quay.io/pypa/${{ matrix.base }}_${{ matrix.arch_alias }}:2023-10-03-72cdc42 \
            --build-arg arch=${{ matrix.arch }} \
            --build-arg arch_short=${{ matrix.arch_short }} \
            --build-arg manylinux=${{ matrix.manylinux }} \
            --build-arg vcpkg=${VCPKG} \
            -t arrow-vcpkg-base \
            -f ci/docker/python-wheel-manylinux.dockerfile .
      - name: Build vcpkg dependencies
        if: steps.done.outputs.cache-hit != 'true'
        timeout-minutes: 35
        run: |
          mkdir -p ci/vcpkg-bincache
          docker run --rm \
            -v $(pwd)/ci/vcpkg-bincache:/vcpkg-bincache \
            -e VCPKG_BINARY_SOURCES="clear;files,/vcpkg-bincache,readwrite" \
            arrow-vcpkg-base \
            timeout --signal=INT 1980 \
            vcpkg install \
              --clean-after-build \
              --x-install-root=/opt/vcpkg/installed \
              --x-manifest-root=/arrow/ci/vcpkg \
              --x-feature=flight \
              --x-feature=gcs \
              --x-feature=json \
              --x-feature=parquet \
              --x-feature=s3
      - name: Save partial vcpkg cache
        if: always() && steps.done.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ci/vcpkg-bincache
          key: vcpkg-manylinux-${{ matrix.manylinux }}-${{ matrix.arch_short }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save complete vcpkg cache
        if: success() && steps.done.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ci/vcpkg-bincache
          key: vcpkg-manylinux-${{ matrix.manylinux }}-${{ matrix.arch_short }}-done-${{ hashFiles('ci/vcpkg/**', '.env') }}

  linux-wheel:
    name: Wheel manylinux ${{ matrix.platform.manylinux }} ${{ matrix.platform.arch_alias }} Python ${{ matrix.python }}
    needs: linux-deps
    # each platform only needs its own deps leg
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.platform.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - manylinux: "2014"
            service: "2014"
            arch: amd64
            arch_alias: x86_64
            arch_short: amd64
            runs-on: ubuntu-24.04
          - manylinux: "2014"
            service: "2014"
            arch: arm64v8
            arch_alias: aarch64
            arch_short: arm64
            runs-on: ubuntu-24.04-arm
          - manylinux: "2_28"
            service: "2-28"
            arch: amd64
            arch_alias: x86_64
            arch_short: amd64
            runs-on: ubuntu-24.04
          - manylinux: "2_28"
            service: "2-28"
            arch: arm64v8
            arch_alias: aarch64
            arch_short: arm64
            runs-on: ubuntu-24.04-arm
        python: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    env:
      # archery uses these environment variables
      ARCH: ${{ matrix.platform.arch }}
      ARCH_ALIAS: ${{ matrix.platform.arch_alias }}
      ARCH_SHORT: ${{ matrix.platform.arch_short }}
      PYTHON: ${{ matrix.python }}
      VCPKG_BINARY_SOURCES: "clear;files,/vcpkg-bincache,read"
    steps:
      - name: Checkout Arrow
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: ci/vcpkg-bincache
          key: vcpkg-manylinux-${{ matrix.platform.manylinux }}-${{ matrix.platform.arch_short }}-done-${{ hashFiles('ci/vcpkg/**', '.env') }}
          fail-on-cache-miss: true
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .docker
          key: ccache-manylinux-${{ matrix.platform.manylinux }}-${{ matrix.platform.arch_short }}-${{ github.run_id }}
          restore-keys: ccache-manylinux-${{ matrix.platform.manylinux }}-${{ matrix.platform.arch_short }}-
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Archery
        run: |
          pip install -e dev/archery[docker]
          mkdir -p ~/.local/bin
          printf '#!/bin/sh\nexec docker compose "$@"\n' > ~/.local/bin/docker-compose
          chmod +x ~/.local/bin/docker-compose
          echo ~/.local/bin >> $GITHUB_PATH
      - name: Restore ORC tarball
        uses: actions/cache@v4
        with:
          path: orc-download
          key: orc-1.9.0-tarball
      - name: Build wheel
        timeout-minutes: 34
        shell: bash
        run: |
          # archive.apache.org intermittently times out (or refuses connections)
          # from the runners: fetch ORC with retries, falling back to a mirror of
          # the same release tarball, check it against the checksum
          # cpp/thirdparty/versions.txt pins and hand the build the local tarball
          mkdir -p orc-download
          orc_sha256=$(grep '^ARROW_ORC_BUILD_SHA256_CHECKSUM=' cpp/thirdparty/versions.txt | cut -d '=' -f2)
          for url in "${ARROW_ORC_URL}" https://repo.huaweicloud.com/apache/orc/orc-1.9.0/orc-1.9.0.tar.gz; do
            echo "${orc_sha256}  orc-download/orc-1.9.0.tar.gz" | sha256sum -c - && break
            curl -fsSL --connect-timeout 30 --retry 3 --retry-all-errors --retry-delay 10 -o orc-download/orc-1.9.0.tar.gz "${url}" || rm -f orc-download/orc-1.9.0.tar.gz
          done
          echo "${orc_sha256}  orc-download/orc-1.9.0.tar.gz" | sha256sum -c -
          # retries with back-off: bundled third-party builds (ORC's own zlib
          # fetch from zlib.net) intermittently fail to download from the runners
          for attempt in 1 2 3; do
            archery docker run -e SETUPTOOLS_SCM_PRETEND_VERSION=${PYARROW_VERSION} -e PIP_INDEX_URL=${PIP_INDEX_URL} -e ARROW_ORC_URL=file:///arrow/orc-download/orc-1.9.0.tar.gz python-wheel-manylinux-${{ matrix.platform.service }} && break
            [ "$attempt" = 3 ] && exit 1
            echo "wheel build attempt ${attempt} failed; retrying after back-off"
            sleep $((attempt * 90))
          done
      - name: Save ccache
        if: always() && matrix.python == '3.12'
        uses: actions/cache/save@v4
        with:
          path: .docker
          key: ccache-manylinux-${{ matrix.platform.manylinux }}-${{ matrix.platform.arch_short }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-manylinux-${{ matrix.platform.manylinux }}-${{ matrix.platform.arch_alias }}-${{ matrix.python }}
          path: python/repaired_wheels/*.whl
          if-no-files-found: error
      - name: Test wheel
        shell: bash
        run: |
          archery docker run -e PIP_INDEX_URL=${PIP_INDEX_URL} python-wheel-manylinux-test-imports
          echo "Deselected (need deleted AWS resources): test_fs.py::test_s3fs_wrong_region test_fs.py::test_resolve_s3_region test_fs.py::test_s3_real_aws"
          archery docker run -e PIP_INDEX_URL=${PIP_INDEX_URL} -e "PYTEST_ADDOPTS=-k '${S3_NETWORK_TESTS_DESELECT}'" python-wheel-manylinux-test-unittests
          echo "${SKIPS_BY_DESIGN}"

  # The HDFS and JVM-interop tests need a running HDFS and a JVM with the Arrow
  # Java jar, which the wheel test containers do not have. Run them here
  # against a built wheel, the way upstream's conda-python-hdfs job
  # (ci/scripts/integration_hdfs.sh) and its jpype job do: a single-node
  # HDFS ${HDFS} (.env) on JDK ${JDK} (.env), and the arrow-tools jar built from java/.
  python-hdfs-jvm:
    name: Python HDFS and JVM tests
    needs: linux-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HADOOP_VERSION: "3.2.1"
      ARROW_HDFS_TEST_HOST: localhost
      ARROW_HDFS_TEST_PORT: "9000"
      ARROW_TEST_DATA: ${{ github.workspace }}/testing/data
      PARQUET_TEST_DATA: ${{ github.workspace }}/cpp/submodules/parquet-testing/data
    steps:
      - name: Checkout Arrow
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: wheel-manylinux-2_28-x86_64-3.10
          path: hdfs-test-wheel
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Start a single-node HDFS
        run: |
          # archive.apache.org throttles the runners (a fetch can stall for most of
          # the job): bound each try, fall back to a mirror of the same release
          # tarball, and check it against Apache's published SHA-512
          hadoop_sha512=d62709c3d7144fcaafc60e18d0fa03d7d477cc813e45526f3646030cd87dbf010aeccf3f4ce795b57b08d2884b3a55f91fe9d74ac144992d2dfe444a4bbf34ee
          for url in https://archive.apache.org/dist/hadoop/common/hadoop-${HADOOP_VERSION}/hadoop-${HADOOP_VERSION}.tar.gz \
                     https://repo.huaweicloud.com/apache/hadoop/common/hadoop-${HADOOP_VERSION}/hadoop-${HADOOP_VERSION}.tar.gz; do
            curl -fsSL --connect-timeout 30 --max-time 420 --retry 2 --retry-all-errors -o hadoop.tar.gz "${url}" \
              && echo "${hadoop_sha512}  hadoop.tar.gz" | sha512sum -c - && break
            rm -f hadoop.tar.gz
          done
          echo "${hadoop_sha512}  hadoop.tar.gz" | sha512sum -c -
          tar -xzf hadoop.tar.gz -C "$RUNNER_TEMP"
          rm hadoop.tar.gz
          HADOOP_HOME="$RUNNER_TEMP/hadoop-${HADOOP_VERSION}"
          cat > "$HADOOP_HOME/etc/hadoop/core-site.xml" <<EOF
          <configuration>
            <property><name>fs.defaultFS</name><value>hdfs://localhost:9000</value></property>
          </configuration>
          EOF
          # upstream's HDFS client/cluster config, as ci/docker/conda-python-hdfs.dockerfile
          # installs it (dfs.support.append, replace-datanode-on-failure off, /data/dfs dirs)
          cp ci/etc/hdfs-site.xml "$HADOOP_HOME/etc/hadoop/"
          sudo mkdir -p /data/dfs
          sudo chown -R "$(id -u):$(id -g)" /data/dfs
          echo "export JAVA_HOME=$JAVA_HOME" >> "$HADOOP_HOME/etc/hadoop/hadoop-env.sh"
          "$HADOOP_HOME/bin/hdfs" namenode -format -force -nonInteractive
          "$HADOOP_HOME/bin/hdfs" --daemon start namenode
          "$HADOOP_HOME/bin/hdfs" --daemon start datanode
          "$HADOOP_HOME/bin/hdfs" dfsadmin -safemode wait
          for i in $(seq 1 30); do
            "$HADOOP_HOME/bin/hdfs" dfsadmin -report | grep -q "Live datanodes (1)" && break
            sleep 2
          done
          "$HADOOP_HOME/bin/hdfs" dfsadmin -report
          echo "HADOOP_HOME=$HADOOP_HOME" >> "$GITHUB_ENV"
      - name: Install the wheel and test dependencies
        run: |
          python -m pip install -r python/requirements-wheel-test.txt
          python -m pip install --only-binary=jpype1 hdfs-test-wheel/*.whl cloudpickle jpype1==1.4.1
      - name: Build arrow-tools jar-with-dependencies from this tree's java/
        run: |
          cd java
          mvn -B -DskipTests -Drat.skip=true -Dcheckstyle.skip=true \
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn \
            -pl tools -am package
          ls -l tools/target/arrow-tools-14.0.2-jar-with-dependencies.jar
      - name: Test HDFS (libhdfs via HADOOP_HOME, then via ARROW_LIBHDFS_DIR)
        run: |
          cd "$RUNNER_TEMP"
          export CLASSPATH=$("$HADOOP_HOME/bin/hadoop" classpath --glob)
          export ARROW_HDFS_TEST_USER=$(whoami)
          export PYARROW_TEST_HDFS=ON
          export PYARROW_HDFS_TEST_LIBHDFS_REQUIRE=ON
          python -m pytest -r s -v -m hdfs --pyargs pyarrow.tests.test_fs pyarrow.tests.test_hdfs
          env -u HADOOP_HOME ARROW_LIBHDFS_DIR="$HADOOP_HOME/lib/native" \
            python -m pytest -r s -v -m hdfs --pyargs pyarrow.tests.test_fs pyarrow.tests.test_hdfs
          echo "HDFS test summary: the 1 skipped test in each HDFS pytest run above is test_hdfs.py::test_fastparquet_read_with_hdfs ('fastparquet NOT enabled'): it is in the opt-in fastparquet pytest group, which upstream's ci/scripts/integration_hdfs.sh also leaves off; every other hdfs-marked test in test_fs.py and test_hdfs.py ran and passed against the live HDFS."
      - name: Test JVM interop (jpype)
        run: |
          cd "$RUNNER_TEMP"
          export ARROW_SOURCE_DIR="$GITHUB_WORKSPACE"
          export ARROW_TOOLS_JAR="$GITHUB_WORKSPACE/java/tools/target/arrow-tools-14.0.2-jar-with-dependencies.jar"
          echo "Deselected: test_jvm.py::test_jvm_buffer_released - calls ArrowBuf.release(), which Arrow Java 14 ArrowBuf no longer has (AttributeError on unmodified upstream 14.0.2 too)"
          echo "Deselected: test_jvm.py::test_jvm_record_batch (17 params) - the test names the pyarrow column 'col' but the JVM field 'field_name', and since 14.0 RecordBatch::Equals compares schemas, so it asserts False on unmodified upstream 14.0.2 (still unchanged in 15.0.0)"
          python -m pytest -r s -v --pyargs pyarrow.tests.test_jvm \
            -k "not test_jvm_buffer_released and not test_jvm_record_batch"

  macos-deps:
    name: vcpkg deps macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: macos-15-intel
            triplet: amd64-osx-static-release
            # host tools use the target triplet (its zlib fdopen fix)
            host_triplet: amd64-osx-static-release
            macos_deployment_target: "10.14"
          - arch: arm64
            runs-on: macos-15
            triplet: arm64-osx-static-release
            host_triplet: arm64-osx
            macos_deployment_target: "11.0"
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.host_triplet }}
      VCPKG_FEATURE_FLAGS: "manifests"
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/ci/vcpkg
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # use the pinned CMake 3.21.4 on PATH instead of the runner's CMake 4
      VCPKG_FORCE_SYSTEM_BINARIES: "1"
    steps:
      - name: Checkout Arrow
        uses: actions/checkout@v4
      # The macOS 15 runners default to an Xcode whose clang/libc++ 19 rejects
      # the 2023 vcpkg ports (grpc 1.51, google-cloud-cpp 2.9); use the
      # newest installed Xcode older than 16.3 (clang 17 / libc++ 17).
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xc=$(ls -d /Applications/Xcode_16.[0-2]*.app | sort -V | tail -1)
          sudo xcode-select -s "$xc"
          clang --version
      - name: Look up complete vcpkg cache
        id: done
        uses: actions/cache/restore@v4
        with:
          path: vcpkg/installed
          key: vcpkg-macos-${{ matrix.arch }}-installed-${{ hashFiles('ci/vcpkg/**', '.env') }}
          lookup-only: true
      - name: Restore partial vcpkg cache
        if: steps.done.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-macos-${{ matrix.arch }}-partial-${{ github.run_id }}
          restore-keys: vcpkg-macos-${{ matrix.arch }}-
      - name: Install System Dependencies
        if: steps.done.outputs.cache-hit != 'true'
        run: brew install bash bison coreutils ninja
      - name: Install Specific CMake version
        if: steps.done.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.21.4/cmake-3.21.4-macos-universal.tar.gz | tar -xzf - -C $RUNNER_TEMP
          echo "$RUNNER_TEMP/cmake-3.21.4-macos-universal/CMake.app/Contents/bin" >> $GITHUB_PATH
      - name: Install Vcpkg
        if: steps.done.outputs.cache-hit != 'true'
        shell: bash
        run: |
          vcpkg_version=$(grep '^VCPKG=' .env | cut -d '=' -f2 | cut -d '#' -f1 | tr -d '" ')
          env -u VCPKG_FORCE_SYSTEM_BINARIES ci/scripts/install_vcpkg.sh $VCPKG_ROOT $vcpkg_version
          echo ${VCPKG_ROOT} >> $GITHUB_PATH
      # google-cloud-cpp 2.9 builds std::future_error from a future_errc, which
      # this SDK's libc++ only allows from C++17 on (its error_code constructor
      # is private). Build that one port as C++17 through an overlay port so
      # ci/vcpkg and the ABI of every other port stay unchanged; abseil pins
      # its options.h to the C++14 choices, so mixing standards is safe.
      - name: Overlay google-cloud-cpp port as C++17
        if: steps.done.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p $RUNNER_TEMP/overlay-ports
          cp -R ${VCPKG_ROOT}/ports/google-cloud-cpp $RUNNER_TEMP/overlay-ports/
          perl -0pi -e 's/(\n        -DBUILD_TESTING=OFF\n)/$1        -DCMAKE_CXX_STANDARD=17\n/' $RUNNER_TEMP/overlay-ports/google-cloud-cpp/portfile.cmake
          grep -n -- '-DCMAKE_CXX_STANDARD=17' $RUNNER_TEMP/overlay-ports/google-cloud-cpp/portfile.cmake
          echo "VCPKG_OVERLAY_PORTS=$RUNNER_TEMP/overlay-ports" >> $GITHUB_ENV
      - name: Build vcpkg dependencies
        if: steps.done.outputs.cache-hit != 'true'
        timeout-minutes: 36
        shell: bash
        run: |
          mkdir -p vcpkg-bincache
          export PATH="$(brew --prefix bison)/bin:${PATH}"
          VCPKG_BINARY_SOURCES="clear;files,$(pwd)/vcpkg-bincache,readwrite" \
          vcpkg install \
            --clean-after-build \
            --x-install-root=${VCPKG_ROOT}/installed \
            --x-manifest-root=ci/vcpkg \
            --x-feature=flight \
            --x-feature=gcs \
            --x-feature=json \
            --x-feature=parquet \
            --x-feature=s3 2>&1 | tee vcpkg-install.log
      # also raise the first error lines as annotations, which stay readable
      # after the job log is no longer retrievable
      - name: Show failed vcpkg build logs
        if: failure() && steps.done.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set +e +o pipefail
          annotate() {
            msg=$(grep -E "$2" "$1" | grep -v -E 'Werror|^\[[0-9]+/[0-9]+\] ' | head -15 | cut -c1-400 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$msg" ] && echo "::error title=$(basename $(dirname $1))/$(basename $1)::$msg"
          }
          annotate vcpkg-install.log 'error|BUILD_FAILED|failed'
          for f in $(ls -t ${VCPKG_ROOT}/buildtrees/*/*.log 2>/dev/null | head -6); do
            echo "=== $f"; grep -n -E 'error|Error' $f | head -40
            annotate "$f" 'error:|FAILED:|Error'
          done
          true
      - name: Save partial vcpkg cache
        if: always() && steps.done.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-macos-${{ matrix.arch }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
      # The wheel jobs restore the installed tree itself: a binary-cache
      # restore would rebuild every port whenever the runner image's
      # compiler differs from the one the deps job used.
      - name: Save installed vcpkg tree
        if: success() && steps.done.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg/installed
          key: vcpkg-macos-${{ matrix.arch }}-installed-${{ hashFiles('ci/vcpkg/**', '.env') }}

  macos-wheel:
    name: Wheel macOS ${{ matrix.platform.arch }} Python ${{ matrix.python }}
    needs: macos-deps
    # each architecture only needs its own deps leg
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.platform.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: x86_64
            runs-on: macos-15-intel
            triplet: amd64-osx-static-release
            # host tools use the target triplet (its zlib fdopen fix)
            host_triplet: amd64-osx-static-release
            macos_deployment_target: "10.14"
            simd_level: "SSE4_2"
          - arch: arm64
            runs-on: macos-15
            triplet: arm64-osx-static-release
            host_triplet: arm64-osx
            macos_deployment_target: "11.0"
            simd_level: "DEFAULT"
        python: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    env:
      ARROW_SIMD_LEVEL: ${{ matrix.platform.simd_level }}
      CC: "clang"
      CXX: "clang++"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_CXX_COMPILER_LAUNCHER: "ccache"
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform.macos_deployment_target }}
      PYARROW_BUILD_VERBOSE: 1
      PYTHON_VERSION: ${{ matrix.python }}
      PYTHON: "/Library/Frameworks/Python.framework/Versions/${{ matrix.python }}/bin/python${{ matrix.python }}"
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.platform.triplet }}
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.platform.host_triplet }}
      VCPKG_FEATURE_FLAGS: "manifests"
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/ci/vcpkg
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # use the pinned CMake 3.21.4 on PATH instead of the runner's CMake 4
      VCPKG_FORCE_SYSTEM_BINARIES: "1"
    steps:
      - name: Checkout Arrow
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      # The macOS 15 runners default to an Xcode whose clang/libc++ 19 rejects
      # the 2023 vcpkg ports (grpc 1.51, google-cloud-cpp 2.9); use the
      # newest installed Xcode older than 16.3 (clang 17 / libc++ 17).
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xc=$(ls -d /Applications/Xcode_16.[0-2]*.app | sort -V | tail -1)
          sudo xcode-select -s "$xc"
          clang --version
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-macos-${{ matrix.platform.arch }}-${{ github.run_id }}
          restore-keys: ccache-macos-${{ matrix.platform.arch }}-
      - name: Install System Dependencies
        run: |
          brew install bash bison coreutils ninja ccache
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
      - name: Install Specific CMake version
        run: |
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.21.4/cmake-3.21.4-macos-universal.tar.gz | tar -xzf - -C $RUNNER_TEMP
          echo "$RUNNER_TEMP/cmake-3.21.4-macos-universal/CMake.app/Contents/bin" >> $GITHUB_PATH
      - name: Install Vcpkg
        shell: bash
        run: |
          vcpkg_version=$(grep '^VCPKG=' .env | cut -d '=' -f2 | cut -d '#' -f1 | tr -d '" ')
          env -u VCPKG_FORCE_SYSTEM_BINARIES ci/scripts/install_vcpkg.sh $VCPKG_ROOT $vcpkg_version
          echo ${VCPKG_ROOT} >> $GITHUB_PATH
      - name: Restore installed vcpkg tree
        uses: actions/cache/restore@v4
        with:
          path: vcpkg/installed
          key: vcpkg-macos-${{ matrix.platform.arch }}-installed-${{ hashFiles('ci/vcpkg/**', '.env') }}
          fail-on-cache-miss: true
      - name: Install Python ${{ matrix.python }}
        shell: bash
        run: sudo ci/scripts/install_python.sh macos ${{ matrix.python }}
      - name: Build Wheel
        timeout-minutes: 30
        shell: bash
        run: |
          $PYTHON -m venv build-env
          source build-env/bin/activate
          pip install --upgrade pip wheel
          PYTHON=python ci/scripts/python_wheel_macos_build.sh ${{ matrix.platform.arch }} $(pwd) $(pwd)/build
      - name: Save ccache
        if: always() && matrix.python == '3.12'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-macos-${{ matrix.platform.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-${{ matrix.platform.arch }}-${{ matrix.python }}
          path: python/repaired_wheels/*.whl
          if-no-files-found: error
      - name: Setup Go (builds the minio test server)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Test Wheel
        shell: bash
        env:
          PYTEST_ADDOPTS: "-k 'not test_cancellation and not test_s3fs_wrong_region and not test_resolve_s3_region and not (test_s3_real_aws and not region_selection)'"
        run: |
          echo "Deselected (need deleted AWS resources): test_fs.py::test_s3fs_wrong_region test_fs.py::test_resolve_s3_region test_fs.py::test_s3_real_aws"
          echo "Deselected by upstream's macOS wheel template (dev/tasks/python-wheels/github.osx.*.yml): test_csv.py::*::test_cancellation"
          # gdb (test_gdb): Homebrew ships GNU gdb for Intel macOS only
          if [ "$(uname -m)" = "x86_64" ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install gdb
            gdb --version | head -1
          fi
          $PYTHON -m venv test-env
          source test-env/bin/activate
          pip install --upgrade pip wheel
          pip install -r python/requirements-wheel-test.txt
          PYTHON=python ci/scripts/install_gcs_testbench.sh default
          # optional test dependencies: the minio server + mc client at the
          # releases ci/scripts/install_minio.sh pins, built from source
          # (dl.min.io no longer serves community MinIO binaries, HTTP 410),
          # and the packages the tests importorskip, numpy held at the
          # version requirements-wheel-test.txt pinned
          export GOBIN="$RUNNER_TEMP/minio/bin"
          go install -ldflags="-X github.com/minio/minio/cmd.ReleaseTag=RELEASE.2022-05-26T05-48-41Z -X github.com/minio/minio/cmd.Version=2022-05-26T05:48:41Z" \
            github.com/minio/minio@RELEASE.2022-05-26T05-48-41Z
          go install -ldflags="-X github.com/minio/mc/cmd.ReleaseTag=RELEASE.2022-05-09T04-08-26Z -X github.com/minio/mc/cmd.Version=2022-05-09T04:08:26Z" \
            github.com/minio/mc@RELEASE.2022-05-09T04-08-26Z
          export PATH="$RUNNER_TEMP/minio/bin:$PATH"
          minio --version && mc --version
          C="$RUNNER_TEMP/test-constraints.txt"
          python -m pip freeze | grep -i '^numpy==' > "$C"
          # multidict (s3fs -> aiohttp) has no cp312 macOS x86_64 wheel at the
          # release date; its 2023 C source trips clang 16's int-conversion error
          CFLAGS="-Wno-error=int-conversion" python -m pip install --prefer-binary -c "$C" cloudpickle fsspec "s3fs[boto3]" minio
          python -m pip install --only-binary :all: -c "$C" scipy
          # a scipy wheel built against a newer numpy C API than the pinned
          # numpy fails to import (cp310 win_amd64 scipy>=1.9 needs numpy 1.22)
          for scipy_pin in "scipy<1.10" "scipy<1.9" "scipy<1.8"; do
            python -c "import scipy.sparse" && break
            python -m pip install --only-binary :all: -c "$C" "$scipy_pin"
          done
          # numba must support the pinned numpy: pick its release per numpy
          # (0.59, the first for numpy 1.26 / Python 3.12, postdates the
          # release and comes from pypi.org)
          NUMBA=$(python -c "import numpy; print({'1.19': '0.53.1', '1.21': '0.56.4', '1.23': '0.57.1'}.get('.'.join(numpy.__version__.split('.')[:2]), ''))")
          if [ -n "$NUMBA" ]; then
            python -m pip install --only-binary :all: -c "$C" "numba==$NUMBA" "sparse==0.14.0"
          else
            echo "numba for numpy 1.26 / Python 3.12 (0.59) postdates the release; installing it from pypi.org"
            PIP_INDEX_URL=https://pypi.org/simple python -m pip install --only-binary :all: -c "$C" "numba==0.59.1" "sparse==0.14.0"
          fi
          python -c "import cloudpickle, fsspec, s3fs, minio, scipy.sparse, sparse, numba, scipy; print('optional test deps OK: scipy', scipy.__version__, 'sparse', sparse.__version__, 'numba', numba.__version__)"
          python -m pip list
          ci/scripts/python_wheel_unix_test.sh $(pwd)
          echo "${SKIPS_BY_DESIGN}"
          if [ "$(uname -m)" = "arm64" ]; then
            echo " - test_gdb 'gdb command unavailable' (arm64 macOS only): GNU gdb has no Apple Silicon port (Homebrew's gdb formula requires an Intel Mac), so no gdb can be installed on this runner."
          fi

  windows-deps:
    name: vcpkg deps Windows
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      VCPKG_DEFAULT_TRIPLET: amd64-windows-static-md-release
      # build host tools with the same triplet (pkg-config passthrough)
      VCPKG_DEFAULT_HOST_TRIPLET: amd64-windows-static-md-release
      VCPKG_FEATURE_FLAGS: "manifests"
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\ci\vcpkg
      VCPKG_ROOT: C:\vcpkg-arrow
    steps:
      - name: Checkout Arrow
        uses: actions/checkout@v4
      - name: Look up complete vcpkg cache
        id: done
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg-arrow\installed
          key: vcpkg-windows-v141-installed-${{ hashFiles('ci/vcpkg/**', '.env') }}
          lookup-only: true
      - name: Restore partial vcpkg cache
        if: steps.done.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-windows-v141-partial-${{ github.run_id }}
          restore-keys: vcpkg-windows-v141-
      - name: Install Vcpkg
        if: steps.done.outputs.cache-hit != 'true'
        shell: bash
        run: |
          vcpkg_version=$(grep '^VCPKG=' .env | cut -d '=' -f2 | cut -d '#' -f1 | tr -d '" ')
          ci/scripts/install_vcpkg.sh /c/vcpkg-arrow $vcpkg_version
          # vcpkg's pinned 7-Zip 21.07 is no longer served by 7-zip.org
          mkdir -p /c/vcpkg-arrow/downloads
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o /c/vcpkg-arrow/downloads/7z2107-extra.7z https://downloads.sourceforge.net/project/sevenzip/7-Zip/21.07/7z2107-extra.7z
      # The released Windows wheels were built with the VS 2017 toolset
      # (v141, MSVC 14.16), whose STL imports CONCRT140.dll where the VS 2022
      # one imports VCRUNTIME140_1.dll. Build the vcpkg ports with it too
      # (an older linker cannot consume newer objects), through a copy of the
      # overlay triplets so ci/vcpkg stays unchanged.
      - name: Install the VS 2017 (v141) toolset
        if: steps.done.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if (-not (Test-Path "$vs\VC\Tools\MSVC\14.16.*")) {
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            $p = Start-Process -FilePath $installer -ArgumentList @('modify', '--installPath', "`"$vs`"", '--add', 'Microsoft.VisualStudio.Component.VC.v141.x86.x64', '--quiet', '--norestart', '--nocache') -Wait -PassThru
            Write-Host "vs_installer exit code: $($p.ExitCode)"
          }
          Get-ChildItem "$vs\VC\Tools\MSVC"
          if (-not (Test-Path "$vs\VC\Tools\MSVC\14.16.*")) { throw "MSVC 14.16 (v141) toolset not installed" }
      - name: Use the v141 toolset for the vcpkg ports
        if: steps.done.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/triplets"
          cp ci/vcpkg/*.cmake "$RUNNER_TEMP/triplets/"
          printf '\nset(VCPKG_PLATFORM_TOOLSET v141)\n' >> "$RUNNER_TEMP/triplets/amd64-windows-static-md-release.cmake"
          echo "VCPKG_OVERLAY_TRIPLETS=$(cygpath -w "$RUNNER_TEMP/triplets")" >> $GITHUB_ENV
      - name: Install pkg-config
        if: steps.done.outputs.cache-hit != 'true'
        shell: bash
        run: |
          C:/msys64/usr/bin/bash.exe -lc "pacman -Sy --noconfirm mingw-w64-x86_64-pkgconf"
          echo "PKG_CONFIG=C:/msys64/mingw64/bin/pkgconf.exe" >> $GITHUB_ENV
      - name: Build vcpkg dependencies
        if: steps.done.outputs.cache-hit != 'true'
        timeout-minutes: 36
        shell: bash
        run: |
          mkdir -p vcpkg-bincache
          VCPKG_BINARY_SOURCES="clear;files,$(cygpath -w $(pwd))\\vcpkg-bincache,readwrite" \
          /c/vcpkg-arrow/vcpkg.exe install \
            --clean-after-build \
            --x-install-root=C:/vcpkg-arrow/installed \
            --x-manifest-root=ci/vcpkg \
            --x-feature=flight \
            --x-feature=gcs \
            --x-feature=json \
            --x-feature=parquet \
            --x-feature=s3
      - name: Save partial vcpkg cache
        if: always() && steps.done.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-windows-v141-partial-${{ github.run_id }}-${{ github.run_attempt }}
      # The wheel jobs restore the installed tree itself: a binary-cache
      # restore would rebuild every port whenever the runner image's MSVC
      # differs from the one the deps job used.
      - name: Save installed vcpkg tree
        if: success() && steps.done.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg-arrow\installed
          key: vcpkg-windows-v141-installed-${{ hashFiles('ci/vcpkg/**', '.env') }}

  windows-wheel:
    name: Wheel Windows Python ${{ matrix.python }}
    needs: windows-deps
    runs-on: windows-2022
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cython / wheel versions the released wheel of each Python was
          # generated and packed with
          - python: "3.8"
            python_full: "3.8.10"
            cython: "0.29.36"
            wheel: "0.41.1"
          - python: "3.9"
            python_full: "3.9.13"
            cython: "0.29.36"
            wheel: "0.41.1"
          - python: "3.10"
            python_full: "3.10.11"
            cython: "0.29.36"
            wheel: "0.41.1"
          - python: "3.11"
            python_full: "3.11.5"
            cython: "0.29.36"
            wheel: "0.41.1"
          - python: "3.12"
            python_full: "3.12.0"
            cython: "3.0.3"
            wheel: "0.41.2"
    env:
      ARROW_CXX_COMPILER: cl
      ARROW_VCPKG_ROOT: C:\vcpkg-arrow
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      # the v141 toolset is installed afresh on every runner, so its cl.exe
      # mtime never matches the cached one: identify the compiler by content
      CCACHE_COMPILERCHECK: content
      # keep the whole build in the cache: a size-triggered cleanup in the
      # middle of the parallel MSVC build stalls it for tens of minutes
      CCACHE_MAXSIZE: 10G
      CMAKE_BUILD_TYPE: release
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_GENERATOR: Ninja
      PYTHON_VERSION: ${{ matrix.python_full }}
      SETUPTOOLS_SCM_PRETEND_VERSION: "14.0.2"
      VCPKG_DEFAULT_TRIPLET: amd64-windows-static-md-release
      # build host tools with the same triplet (pkg-config passthrough)
      VCPKG_DEFAULT_HOST_TRIPLET: amd64-windows-static-md-release
      VCPKG_FEATURE_FLAGS: "manifests"
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\ci\vcpkg
      VCPKG_ROOT: C:\vcpkg-arrow
    steps:
      - name: Checkout Arrow
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-windows-v141c-${{ matrix.python }}-${{ github.run_id }}
          # the Arrow C++ objects (the bulk of the build) do not depend on the
          # Python version: take the newest cache of any leg
          restore-keys: |
            ccache-windows-v141c-
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_full }}
      - name: Install the VS 2017 (v141) toolset
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if (-not (Test-Path "$vs\VC\Tools\MSVC\14.16.*")) {
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            $p = Start-Process -FilePath $installer -ArgumentList @('modify', '--installPath', "`"$vs`"", '--add', 'Microsoft.VisualStudio.Component.VC.v141.x86.x64', '--quiet', '--norestart', '--nocache') -Wait -PassThru
            Write-Host "vs_installer exit code: $($p.ExitCode)"
          }
          Get-ChildItem "$vs\VC\Tools\MSVC"
          if (-not (Test-Path "$vs\VC\Tools\MSVC\14.16.*")) { throw "MSVC 14.16 (v141) toolset not installed" }
      - name: Install Tools
        shell: pwsh
        run: |
          choco install --no-progress -r -y ccache
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          # VS 2017 (v141, MSVC 14.16) toolset, as the released wheels and the
          # vcpkg ports of windows-deps
          $vcvars = "$env:RUNNER_TEMP\vcvars64-v141.bat"
          "@call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" -vcvars_ver=14.16" | Out-File -FilePath $vcvars -Encoding ascii
          "VCVARS64_BAT=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Append
          # bundle the v141 (VC141.CRT) msvcp140.dll the released wheels carry
          Get-ChildItem -Path "$vs\VC\Redist" -Recurse -Filter msvcp140.dll | Where-Object { $_.FullName -match '\\x64\\' } | ForEach-Object { Write-Host "$($_.FullName) $($_.VersionInfo.FileVersion)" }
          $dll = Get-ChildItem -Path "$vs\VC\Redist" -Recurse -Filter msvcp140.dll | Where-Object { $_.FullName -match '\\MSVC\\[0-9.]+\\x64\\Microsoft\.VC141\.CRT\\' } | Select-Object -First 1
          if (-not $dll) {
            $redist = Get-ChildItem -Path "$vs\VC\Redist\MSVC" -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
            $dll = Get-ChildItem -Path "$($redist.FullName)\x64" -Recurse -Filter msvcp140.dll | Select-Object -First 1
          }
          Write-Host "Bundling $($dll.FullName)"
          "MSVCP140_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          python -m pip install -U pip setuptools
          python -m pip install -r python/requirements-wheel-build.txt "cython==${{ matrix.cython }}" "wheel==${{ matrix.wheel }}"
      - name: Install Vcpkg
        shell: bash
        run: |
          vcpkg_version=$(grep '^VCPKG=' .env | cut -d '=' -f2 | cut -d '#' -f1 | tr -d '" ')
          ci/scripts/install_vcpkg.sh /c/vcpkg-arrow $vcpkg_version
          # vcpkg's pinned 7-Zip 21.07 is no longer served by 7-zip.org
          mkdir -p /c/vcpkg-arrow/downloads
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o /c/vcpkg-arrow/downloads/7z2107-extra.7z https://downloads.sourceforge.net/project/sevenzip/7-Zip/21.07/7z2107-extra.7z
      - name: Restore installed vcpkg tree
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg-arrow\installed
          key: vcpkg-windows-v141-installed-${{ hashFiles('ci/vcpkg/**', '.env') }}
          fail-on-cache-miss: true
      - name: Build wheel
        timeout-minutes: 55
        shell: cmd
        run: |
          mklink /J C:\arrow "%GITHUB_WORKSPACE%"
          set "PATH=%PATH%;C:\Program Files\Git\usr\bin"
          call C:\arrow\ci\scripts\python_wheel_windows_build.bat
      - name: Show runtime DLL imports of the built binaries
        shell: pwsh
        run: |
          ccache -s
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          Get-ChildItem -Path python\pyarrow,python\build -Include *.dll,*.pyd -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "== $($_.Name)"
            & $dumpbin.FullName /nologo /dependents $_.FullName | Select-String -Pattern '\.dll' | ForEach-Object { Write-Host "   $($_.Line.Trim())" }
          }
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-windows-v141c-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-${{ matrix.python }}
          path: python/dist/*.whl
          if-no-files-found: error
      - name: Install optional test dependencies
        shell: bash
        run: |
          # IANA tz database + windowsZones.xml in %USERPROFILE%\Downloads\tzdata,
          # with upstream's own script (used by its appveyor C++/Python job)
          bash ci/scripts/download_tz_database.sh
          # the packages the tests importorskip, numpy held at the version
          # requirements-wheel-test.txt pins
          python -m pip install -r python/requirements-wheel-test.txt
          C="$(cygpath -u "$RUNNER_TEMP")/test-constraints.txt"
          python -m pip freeze | grep -i '^numpy==' > "$C"
          python -m pip install --prefer-binary -c "$C" cloudpickle fsspec "s3fs[boto3]" minio
          # GCS testbench: the v0.36.0 that python_wheel_windows_test.bat
          # installs pins grpcio 1.54.0, which has no cp312 wheel (its source
          # build fails); on 3.12 install v0.39.0, the version
          # ci/scripts/install_gcs_testbench.sh uses on Linux/macOS
          if python -c "import sys; sys.exit(0 if sys.version_info >= (3, 12) else 1)"; then
            python -m pip install --upgrade setuptools
            python -m pip install "https://github.com/googleapis/storage-testbench/archive/v0.39.0.tar.gz"
            python -c "import testbench; print('GCS testbench installed')"
          fi
          python -m pip install --only-binary :all: -c "$C" scipy
          # a scipy wheel built against a newer numpy C API than the pinned
          # numpy fails to import (cp310 win_amd64 scipy>=1.9 needs numpy 1.22)
          for scipy_pin in "scipy<1.10" "scipy<1.9" "scipy<1.8"; do
            python -c "import scipy.sparse" && break
            python -m pip install --only-binary :all: -c "$C" "$scipy_pin"
          done
          # numba must support the pinned numpy: pick its release per numpy
          # (0.59, the first for numpy 1.26 / Python 3.12, postdates the
          # release and comes from pypi.org)
          NUMBA=$(python -c "import numpy; print({'1.19': '0.53.1', '1.21': '0.56.4', '1.23': '0.57.1'}.get('.'.join(numpy.__version__.split('.')[:2]), ''))")
          if [ -n "$NUMBA" ]; then
            python -m pip install --only-binary :all: -c "$C" "numba==$NUMBA" "sparse==0.14.0"
          else
            echo "numba for numpy 1.26 / Python 3.12 (0.59) postdates the release; installing it from pypi.org"
            PIP_INDEX_URL=https://pypi.org/simple python -m pip install --only-binary :all: -c "$C" "numba==0.59.1" "sparse==0.14.0"
          fi
          python -c "import cloudpickle, fsspec, s3fs, minio, scipy.sparse, sparse, numba, scipy; print('optional test deps OK: scipy', scipy.__version__, 'sparse', sparse.__version__, 'numba', numba.__version__)"
          python -m pip list
      - name: Test wheel
        shell: cmd
        env:
          PYTEST_ADDOPTS: "-k \"not test_s3fs_wrong_region and not test_resolve_s3_region and not (test_s3_real_aws and not region_selection)\""
        run: |
          echo Deselected (need deleted AWS resources): test_fs.py::test_s3fs_wrong_region test_fs.py::test_resolve_s3_region test_fs.py::test_s3_real_aws
          call C:\arrow\ci\scripts\python_wheel_windows_test.bat
      - name: Explain the remaining skips
        shell: bash
        run: |
          echo "${SKIPS_BY_DESIGN}"
          echo " - s3 / orc 'NOT enabled' on Windows: upstream's ci/scripts/python_wheel_windows_test.bat sets PYARROW_TEST_S3=OFF and PYARROW_TEST_ORC=OFF; the mc-based S3 tests skip on win32 in the test code itself."
